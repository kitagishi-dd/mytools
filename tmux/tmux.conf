# ── 表示 ──────────────────────────────────────
# TERM=screen → 256色/truecolor対応に
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"        # truecolor (Windows Terminal対応)

# ── マウス ────────────────────────────────────
set -g mouse on                            # スクロール/ペイン選択/リサイズ/コピーモード
set -g history-limit 50000                 # スクロールバック増

# ── コピー ────────────────────────────────────
set -g set-clipboard on                    # tmuxのコピーをOSC52でローカルへ転送
setw -g mode-keys vi
# ドラッグ終了で「コピー＆コピーモード維持(選択は残す)」、画面は飛ばさない
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear
bind -T copy-mode-vi y                send -X copy-selection-no-clear
